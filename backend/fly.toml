app = "project-summary-mkoo"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATA_DIR = "/data"
  ADMIN_COOKIE_SECURE = "true"
  # 챗봇 답변 모델 (gpt-4o = 품질 우선 / gpt-4o-mini = 비용 우선)
  CHAT_MODEL = "gpt-4o"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

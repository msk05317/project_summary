# OneView 서버 배포 설정 — **이 파일 하나만 쓴다.**
#
# 반드시 저장소 루트에서 `flyctl deploy` 를 돌린다.
# backend/Dockerfile 이 `COPY backend/requirements.txt` 와 `COPY CHANGELOG.md`
# 를 하니, 빌드 기준 폴더가 루트여야 한다. backend/ 안에서 돌리면
# backend/backend/requirements.txt 를 찾다가 실패한다.
# (예전에 backend/fly.toml 이 하나 더 있었다. 설정은 더 자세했지만 그 폴더에서는
#  빌드가 아예 안 돼서 쓸 수 없었다. 내용을 이리로 옮기고 그 파일은 치웠다.)

app = "project-summary-mkoo"
primary_region = "nrt"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8080"              # Dockerfile CMD / internal_port 와 같아야 한다
  CHAT_MODEL = "gpt-4o"      # 챗봇 모델 (gpt-4o = 품질 / gpt-4o-mini = 비용)
  ADMIN_COOKIE_SECURE = "true"   # https 전용이므로 관리자 쿠키에 Secure 를 건다

# 비밀값은 여기 적지 않는다. `flyctl secrets set 이름=값` 으로 넣고
# `flyctl config env -a project-summary-mkoo` 로 목록만 확인한다.
# 지금 들어 있는 것 — DATA_DIR(=/data) · OPENAI_API_KEY ·
#                     ADMIN_SESSION_SECRET · FIREBASE_SERVICE_ACCOUNT_JSON
#
# DATA_DIR 이 빠지면 데이터가 /data 볼륨이 아니라 컨테이너 안에 쓰여서
# 다음 배포 때 통째로 사라진다. 배포 전에 한 번 확인하는 습관이 안전하다.

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # 안 쓰면 서버가 잔다. 첫 접속이 몇 초 걸리고, flyctl ssh 는 자는 서버를
  # 못 깨운다(backup.sh 가 맨 앞에서 /health 로 깨우는 이유).
  # 늘 깨워 두려면 auto_stop_machines = "off", min_machines_running = 1.
  auto_stop_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "data"
  destination = "/data"

# 머신 크기는 지금 떠 있는 것을 그대로 쓴다 (`flyctl status` 로 확인).
# 여기에 [[vm]] 을 적으면 다음 배포 때 그 크기로 바뀐다.
